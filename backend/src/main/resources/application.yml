spring:
  application:
    name: tinyarcade
  config:
    # backend 폴더의 .env를 읽는다. 배포 서버에서는 같은 이름의 환경변수로 대체된다.
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # [썸네일] 업로드 한도. 500KB 검사는 ThumbnailValidator가 하고(안내 문구), 이보다 큰 파일은 스프링이 먼저 막는다
      max-file-size: 1MB
      max-request-size: 2MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 1000

server:
  # 배포(Render)는 PORT 환경변수, 로컬은 8080
  port: ${PORT:8080}

jwt:
  # 서명 키: 로컬은 backend/.env, 배포는 Render 환경변수 (03_10_tinyarcade_auth)
  secret: ${JWT_SECRET}
  expire-hours: 24

app:
  # 11번 앱 등록·배포 (03_11_tinyarcade_app §2 환경변수)
  # GitHub 토큰(공개 레포 읽기 전용). 비어 있으면 토큰 없이 요청한다(시간당 60회 제한)
  github-token: ${GITHUB_TOKEN:}
  # 게임 파일을 전달하는 주소(사이트와 다른 주소). 응답의 playUrl을 만들 때 쓴다
  serve-origin: ${APP_SERVE_ORIGIN:http://localhost:8080}
  # 게임 파일을 iframe으로 띄울 수 있는 사이트 주소(쉼표로 여러 개)
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}

ranking:
  # 12번 세션·이상값 (01_core_logic_ranking G1 설정값, 03_12_tinyarcade_session §2)
  session:
    expire-minutes: 60        # S-02: 시작 후 이 시간이 지나면 제출 거부
  leaderboard:
    top-n: 100                # [15번] 앱 리더보드 최대 줄 수 (01 B2 LEADERBOARD_TOP_N)
  formula:                    # [17번] 유저 랭킹 계수 공식 (01 D2)
    base-points: 100          # 1등 1건 기본 포인트. 운영 시작 후 바꾸지 않는다(포인트를 조회 때 계산하므로 바꾸면 과거 포인트가 모두 바뀜)
    w-rec: 0.5                # 추천 계수 가중치 (계수 범위 1.0~1.5)
    w-part: 0.5               # 참여자 계수 가중치 (w-rec와 같게 두어 두 계수가 비등하게 경쟁)
  anomaly:
    z-threshold: 3.0          # R-ZS(점수 Z ≥ +3), R-ZT(플레이 시간 Z ≤ -3)
    min-sample: 30            # 기준 기록이 이보다 적으면 Z 검사 생략 (R-MAX는 항상)
